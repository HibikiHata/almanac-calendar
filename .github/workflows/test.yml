name: test

on:
  push:
    branches: [main]
  pull_request:

# 読み取りだけあれば足りる。書き込みが要る job は自分で明示する
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest
      - name: Run tests
        run: PYTHONPATH=src python3 -m pytest tests -q

  action:
    # The action is the published interface. Testing the library without
    # exercising action.yml would let the two drift apart silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          out: dist
          rokuyo: "true"
          solar_terms: "true"
          moon: "true"
          holidays: "JP"
          holiday_names: "true"
          annotation_mode: "stack"
          border: "true"
      - name: Check the artefacts exist and are non-trivial
        run: |
          set -euo pipefail
          for f in dist/calendar-light.svg dist/calendar-dark.svg dist/calendar.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          grep -q "<svg" dist/calendar-light.svg
