name: generate

on:
  schedule:
    # 15:10 UTC = 00:10 JST — just after the Japanese day rolls over, with a few
    # minutes of slack because scheduled runs are not punctual.
    - cron: "10 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# A run started while another is still going would race on the output branch.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate the showcase variants
        uses: ./
        with:
          out: dist
          rokuyo: "true"
          solar_terms: "true"
          moon: "true"
          holidays: "JP"
          holiday_names: "true"
          annotation_mode: "stack"
          border: "true"
          font: "noto-sans-jp"

      - name: Publish to the output branch
        # Artefacts go to a branch of their own so the daily commits never touch
        # main's history. They are then readable at
        #   raw.githubusercontent.com/<owner>/<repo>/output/<file>
        # which serves with max-age=300 and is not proxied through Camo.
        #
        # This builds the branch in a scratch repository outside the workspace.
        # Rewriting the checkout in place (orphan branch + rm -rf) deletes
        # action.yml along with everything else, and the job's own post-steps
        # then fail looking for it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pub="$(mktemp -d)"
          cp dist/* "$pub/"
          cd "$pub"
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: regenerate $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
          echo "published to the output branch"
